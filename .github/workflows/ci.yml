name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux jobs run on GitHub-hosted runners.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.2"

      # The zsh test in internal/shell and TestRealGitleaks in internal/guard
      # skip when their tool is missing, and the hosted image has neither.
      - name: Install zsh and pinned gitleaks
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tgz

      - name: No Charm v1 imports
        run: |
          if grep -rnE --include='*.go' '"github\.com/charmbracelet/(lipgloss|bubbletea|bubbles|huh|log|fang|glamour)[/"]' .; then
            echo "::error::Import Charm v2 from charm.land/..., not github.com/charmbracelet/..."
            exit 1
          fi

      # The commit guard and secrets tests run the real tools. The secrets
      # interop script needs age 1.3's age-plugin-batchpass, which apt's age
      # lacks, so age comes from source at the version go.mod pins.
      - name: Install age
        run: |
          go install filippo.io/age/cmd/age@v1.3.2 filippo.io/age/cmd/age-keygen@v1.3.2 filippo.io/age/cmd/age-plugin-batchpass@v1.3.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: go build ./...
      - run: go vet ./...

      - name: Generated reference pages and schemas are current
        run: go run ./tools/gendocs docs -check

      # Tests must never depend on the real home: a test that reaches $HOME fails.
      - name: go test
        run: |
          GOCACHE="$(go env GOCACHE)"
          GOMODCACHE="$(go env GOMODCACHE)"
          export GOCACHE GOMODCACHE
          HOME=/nonexistent go test ./...

      - name: Generated reserved command names are current
        run: go run ./tools/gennames -check

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0

  # macOS differs where the sandbox guard and proc are delicate: $TMPDIR ends
  # in a slash and sits under /var, a symlink to /private/var.
  go-macos:
    # Self-hosted, single-use VMs. This `if` is only the first filter: it keeps
    # pull requests from forks from queuing for the runner. The guard a fork
    # cannot change is the runner image's job-started hook, which refuses jobs
    # from outside the org and pull requests whose head repository is outside
    # it; the host loop pins the repository ID before JIT registration. The
    # filter assumes this workflow runs only on push and pull_request; review
    # needed before adding any other trigger.
    if: vars.MACOS_CI == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, homebot-mac]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.2"
      # The commit guard and secrets tests run the real tools; age as in
      # the go job.
      - name: Install age and gitleaks
        run: |
          go install filippo.io/age/cmd/age@v1.3.2 filippo.io/age/cmd/age-keygen@v1.3.2 filippo.io/age/cmd/age-plugin-batchpass@v1.3.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          brew install gitleaks
      - name: go test
        run: |
          GOCACHE="$(go env GOCACHE)"
          GOMODCACHE="$(go env GOMODCACHE)"
          export GOCACHE GOMODCACHE
          HOME=/nonexistent go test ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - name: ShellCheck POSIX installer
        run: shellcheck -s sh install.sh
      - name: ShellCheck scripts
        shell: bash
        run: |
          files=(internal/actions/scripts/*.sh internal/guard/pre-commit.sh docs/landing/install.sh scripts/release-test.sh)
          dirs=(scripts/release-test scripts/release)
          while IFS= read -r -d '' file; do files+=("$file"); done \
            < <(find "${dirs[@]}" -type f -name '*.sh' -print0)
          shellcheck "${files[@]}"

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check
      - name: Actionlint workflows
        shell: bash
        run: |
          curl -fsSL -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz' | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint .github/workflows/*.yml
