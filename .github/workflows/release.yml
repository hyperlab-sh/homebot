name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "::error::invalid release tag"; exit 1; }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || { echo "::error::release tag is not on main"; exit 1; }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version: "1.27.2"}
      - name: Install age
        run: |
          go install filippo.io/age/cmd/age@v1.3.2 filippo.io/age/cmd/age-keygen@v1.3.2 filippo.io/age/cmd/age-plugin-batchpass@v1.3.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install pinned gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - run: gitleaks git --redact --no-banner --log-opts=--all
      - run: go vet ./...
      - name: Test
        run: |
          GOCACHE="$(go env GOCACHE)"
          GOMODCACHE="$(go env GOMODCACHE)"
          export GOCACHE GOMODCACHE
          HOME=/nonexistent go test ./...
      - name: Generate extras
        run: |
          bash scripts/release/extras.sh "${GITHUB_REF_NAME#v}" "$(TZ=UTC git log -1 --date=iso-strict-local --format=%cd)" dist-extra
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: extras, path: dist-extra/, retention-days: 1, if-no-files-found: error}
  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions: {contents: write, id-token: write}
    steps:
      - name: Require public repository
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$REPO_PRIVATE" == true ]]; then echo "::error::keyless release requires a public repository"; exit 1; fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Require Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN_SET: ${{ secrets.HOMEBREW_TAP_TOKEN != '' && 'yes' || '' }}
        run: |
          test -n "$HOMEBREW_TAP_TOKEN_SET" || { echo "::error::HOMEBREW_TAP_TOKEN is not set"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: extras, path: dist-extra/}
      - name: Check release inputs
        run: |
          for f in THIRD_PARTY_NOTICES completions/homebot.bash completions/_homebot completions/homebot.fish man/homebot.1 man/homebot.1.gz; do
            test -s "dist-extra/$f" || { echo "::error::missing release extra $f"; exit 1; }
          done
          test -s install.sh || { echo "::error::missing install.sh"; exit 1; }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version: "1.27.2"}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - uses: anchore/sbom-action/download-syft@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with: {syft-version: v1.54.1}
      # A release candidate (v0.1.0-rc.1) reuses the notes of the release it
      # precedes (v0.1.0), and those notes name their own tag: the heading and
      # the cosign --certificate-identity. Published as is, an rc would tell
      # readers to verify against a tag that does not exist yet, and cosign
      # would reject it. So for an rc, publish a copy with the rc tag swapped in.
      # Prose that merely names the release line ("in v0.1.0") stays as written.
      - name: Select notes
        id: notes
        run: |
          base="${GITHUB_REF_NAME%%-rc.*}"
          file=".github/release-notes/$base.md"
          if [[ -f "$file" && "$GITHUB_REF_NAME" != "$base" ]]; then
            rc_file="$RUNNER_TEMP/release-notes-$GITHUB_REF_NAME.md"
            sed -e "s|refs/tags/$base|refs/tags/$GITHUB_REF_NAME|g" \
                -e "s|^# homebot $base\$|# homebot $GITHUB_REF_NAME|" \
                "$file" > "$rc_file"
            file="$rc_file"
          fi
          if [[ -f "$file" ]]; then
            echo "args=release --clean --release-notes $file" >> "$GITHUB_OUTPUT"
          else
            echo 'args=release --clean' >> "$GITHUB_OUTPUT"
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: contains(github.ref_name, '-rc.')
        with: {name: homebot-cask, path: dist/homebrew/Casks/homebot.rb, retention-days: 7, if-no-files-found: error}
  # homebot.sh deploys from the `site` branch. A final release moves it to the
  # release tag; a release candidate never does. The job needs no secret and no
  # `environment`: the release job already passed that gate, and the `release`
  # environment's tag rule would add a second approval for nothing. The push is a
  # plain update, never forced: a `site` that is ahead of the tag (or has
  # diverged) fails here, and the "Deploy site" workflow is the deliberate way to
  # move it anyway. A missing `site` is created by the push.
  site:
    needs: release
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    permissions: {contents: write}
    # Shared with the "Deploy site" workflow so the two never move `site` at once.
    concurrency: {group: site-branch, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        # The one place the token must persist: git push below uses it.
        with: {persist-credentials: true, fetch-depth: 0}
      - name: Move site to the release tag
        shell: bash
        run: |
          set -euo pipefail
          # The release job's validation allows only vX.Y.Z and vX.Y.Z-rc.N; refuse
          # anything else here too, in case that ever changes.
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$GITHUB_REF_NAME is not a final release tag; site not moved"; exit 1; }
          new=$(git rev-parse --verify "refs/tags/$GITHUB_REF_NAME^{commit}")
          # ls-remote: 0 = site exists, 2 = it does not, anything else = a real error.
          rc=0
          git ls-remote --exit-code --heads origin refs/heads/site >/dev/null || rc=$?
          case $rc in
            0)
              git fetch --no-tags origin +refs/heads/site:refs/remotes/origin/site
              old=$(git rev-parse --verify refs/remotes/origin/site)
              if ! git merge-base --is-ancestor "$old" "$new"; then
                echo "::error::site ($old) is ahead of or has diverged from $GITHUB_REF_NAME ($new); not moving it. Run the 'Deploy site' workflow to move it on purpose."
                exit 1
              fi
              ;;
            2) old="(none, created)" ;;
            *) echo "::error::cannot read site from origin (ls-remote exit $rc)"; exit 1 ;;
          esac
          git push origin "refs/tags/$GITHUB_REF_NAME^{commit}:refs/heads/site"
          {
            echo "### site moved to $GITHUB_REF_NAME"
            echo
            echo "| | commit |"
            echo "|---|---|"
            echo "| old | \`$old\` |"
            echo "| new | \`$new\` |"
          } >> "$GITHUB_STEP_SUMMARY"
