    color: "heading"
    class: voice
    persona: true
    source: "src/inbox.ts:251"
    notes: "Verb agreement hand-rolled: need${n===1?'s':''}. Tests assert '7 things need you (1 urgent)'. The inbox render puts the '{bot} · {host} · ' prefix in front, in the same style as the line, and appends inbox.header.urgent."
