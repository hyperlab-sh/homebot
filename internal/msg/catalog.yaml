# -- naming: config keys
  - id: config.error.name
    kind: error
    text: "{where}: {name_key} must be a word, the command you call your homebot by, such as {example}"
    placeholders:
      - name: where
        type: string
        meaning: "where in the file: '<file>:<line>:<col>'"
      - name: name_key
        type: string
        value: "name"
        meaning: "the name config key (fixed)"
      - name: example
        type: string
        value: "zork"
        meaning: "an example command name (fixed)"
    color: "plain"
    class: voice
    persona: true
    source: "internal/config/load.go"
    notes: "Go-only. name: holds something that is not a string: a number, a list, a map, an empty value."
  - id: config.error.name_syntax
    kind: error
    text: "{where}: {name_key} \"{value}\" must be {rule}"
    placeholders:
      - name: where
        type: string
        meaning: "where in the file: '<file>:<line>:<col>'"
      - name: value
        type: string
        meaning: "the name as written"
