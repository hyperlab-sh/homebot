# homebot user-facing message catalog
# Generated 2026-10-12 from dothaul's Bun/TypeScript sources (read-only inventory), then reconciled with the Go port (persona flags, appended commands, {bot}, placeholder types, renames). This file is the single source.
# Every message the CLI, the shell integration, the hook and the bundled action scripts show a person.
# Every source: points at dothaul's TypeScript source (src/..., actions/..., shell/..., hooks/... do not exist in this repository); text is copied exactly, with dynamic parts turned into placeholders.

version: 1

conventions:
  placeholder: "{name} is replaced by a value. Every placeholder is listed under the entry's 'placeholders' with its meaning."
  plural: "{n:one|other} picks a form by the count n; '#' inside a form stands for the number. Example: {n:# secret|# secrets}. Mirrors ui.ts plural(), which only knows one/other."
  literal_braces: "{{ and }} are literal braces (e.g. the export bug text and the brew summary)."
  class:
    voice: "Wording only. Every fact (path, command, count, name) arrives through a placeholder, a fixed placeholder or the append, so a persona may rewrite the whole template as long as it keeps the placeholders. Every persona: true entry is class voice."
    fact: "The text itself is a fact: a command to run, a usage line, a path, a value from a tool, a protocol token that code or the shell parses, or pure layout around facts. Never varies by persona."
    mixed: "Wording with facts written into the literal text (command names, file names, config keys, key letters, durations). Being lifted: each fact moves into a fixed placeholder or the append and the entry becomes voice. Every voiced mixed entry has been lifted, so the ratchet lists in internal/msg/testdata (unlifted-a.txt, unlifted-b.txt) are gone (TestPersonaEntriesAreVoice treats a missing file as empty); no persona: true entry may be mixed."
  kind:
    error: "a failure: thrown UserError text, red lines, guard problems, tool-failure summaries"
    warning: "something the user should know but not a failure (yellow)"
    status: "progress or result lines, neutral"
    success: "something done (green word or line)"
    prompt: "text shown while waiting for input"
    choice: "a menu entry or key map the user picks from"
    help: "--help text, action summaries, comments in printed files"
    inbox: "inbox item titles and details, and inbox screen chrome"
    nudge: "the shell start-up line, prompt segment and their caches"
    notification: "desktop notification title, body, app name"
    commit: "git commit messages and authors homebot writes"
    hint: "a lead-in to a command, or the command line itself"
    label: "a single word or short phrase used as a column, status word, mark or placeholder value"
  color: "A style name from 'palette'. 'plain' means uncolored. '(first word only)' and similar describe partial coloring inside one line."
  speaker_name: "true when 'homebot' appears as the one speaking or acting ('homebot needs you'), as opposed to the command, a file name or a unit name. Where the entry is persona-overridable and is not an error, the speaker became {bot} and the flag was removed. Errors, the guard and everything not persona-overridable keep the literal name, so the flag stays."
  level_and_fix: "Inbox titles also carry 'level' (urgent|todo) and 'fix' (the command shown after the arrow, a fact)."
  persona: "true when a persona may override the entry's text. The rule: set on every entry whose kind is error, warning, status, success, prompt, hint, inbox, nudge or notification, whose class is voice or mixed, and whose area is not guard. An entry the rule selects may stay fixed only with 'persona: false' and a note that starts 'Not voiced:' and says why (the urgency suffixes inbox.header.urgent and inbox.nudge.urgent, for one). Never voiced, whatever the rule: kinds help, commit, label and choice, class fact, the guard area and persona tooling diagnostics. Absent means false. Persona text must keep every non-optional placeholder, fixed ones included; the renderer falls back to the catalog's text for a line that does not."
  append: "A literal string that layout code adds after the entry's text, so persona text never contains a command. Example: inbox.next_hint is 'Do the first one now:' with append ' {self} next'. The neutral output is text + append, byte for byte the same as the TypeScript. Only persona: true entries have one, and it holds no placeholder other than {self}: a trailing command with another placeholder becomes adjacent fixed placeholders instead (see value)."
  placeholder_type: "Every placeholder has a 'type': int (a count or number; plural selectors like {n:one|other} need int), string, path (a file system path; code shortens it to ~/... and styles it) or duration (code formats it through format.ago.*)."
  placeholder_optional: "'optional: true' on a placeholder means the code may leave it empty or omit it. In persona-overridable entries every placeholder not marked optional must appear in every persona variant; optional ones may be dropped."
  value: "'value' on a placeholder makes it fixed: a fact lifted out of the sentence (a command, a file name, a config key, an env var, a key letter) that is always this string. The generator fills it in, so the accessor's signature and the neutral output do not change, and code never passes it. A fixed placeholder has type string, is never optional, has a non-empty value, appears in the text, and its meaning ends with '(fixed)'. Example: action.link.warning.in_way is ', {n} in the way (see: {cmd})' with cmd fixed to '{self} link'. A fixed value may hold {self}, expanded once by the renderer. Facts glued to a placeholder become adjacent placeholders ('{name}{ext}', ext fixed to '.yml')."
  self: "{self} is the command word: the effective name in printed output and homebot in stored text. It is a required string placeholder in text and is filled by the renderer; append and fixed value may use it without declaring it."
  bot: "{bot} is the effective name in printed output when one works, otherwise the persona's display name (homebot in the neutral voice). It replaces the literal 'homebot' where homebot is the speaker in a persona-overridable entry that is not an error ('{bot} needs you'). It is declared as an optional string placeholder in each such entry. In errors (the 'homebot: ...' stderr prefix is the program name) and in the guard, 'homebot' stays literal."
  palette_token: "Each palette entry carries 'token', the lipgloss token it maps to (plan 6.11, 6.12). Persona tokens: accent, ok, muted. Fixed tokens: urgent, todo, command, error, notice. 'none' is unstyled. An entry's 'color' keeps its palette style name; heading and alarm are also bold."

palette:
  success:
    ansi: "green (SGR 32/39)"
    token: ok
    used_for: "Something done: status words packed, sealed, unlocked, committed, pulled, pushed, created, remote, reachable, installed, saved, done, deleted, updated, unchanged; link op labels link/relink/adopt; whole lines like 'Nothing needs you.', 'Unpacked X.', the all-clear inbox header and triage/cleanup results."
  error:
    ansi: "red (SGR 31/39)"
    token: error
    used_for: "Failures: the 'homebot: ' error prefix line, conflict, failed, blocked and invalid labels, layout-error counts, 'not a git repository', 'failing', remote unreachable headlines, bad repo name, red triage/cleanup errors."
  urgent:
    ansi: "red (SGR 31/39)"
    token: urgent
    used_for: "Inbox urgency: the '!' item mark and the ' (N urgent)' suffix. Same ANSI as error, different meaning."
  warning:
    ansi: "yellow (SGR 33/39)"
    token: todo
    used_for: "Needs attention but not broken: moved aside, kept, the 'remove' op label, ', N blocked', 'N in the way', identity warning, save waiting/unreachable, inventory nags (none chosen, changed since, no keys yet, never pushed, not installed), setup no-repo."
  todo:
    ansi: "yellow (SGR 33/39)"
    token: todo
    used_for: "Inbox non-urgent mark '•'. Same ANSI as warning."
  command:
    ansi: "cyan (SGR 36/39)"
    token: command
    used_for: "A command to run: ui.command() lines, the inbox '→ fix' line, next's '→ fix', setup's source line, identity fix."
  progress:
    ansi: "cyan (SGR 36/39)"
    token: command
    used_for: "unpack step labels '[i/N] step' while running. Same ANSI as command."
  notice:
    ansi: "blue (SGR 34/39)"
    token: notice
    used_for: "Only the 'unfold' link op label. The single use of blue."
  heading:
    ansi: "bold (SGR 1/22)"
    token: accent
    used_for: "Titles and labels: inbox header, inventory title and row labels, unpack header, triage header, [i/n] counters, remote 'Nothing is backed up yet', help Usage/Options/Examples, group headings, the bold 'homebot' in the overview, next's item title, action names in `homebot actions`."
  muted:
    ansi: "dim (SGR 2/22)"
    token: muted
    used_for: "Secondary text: item details, lead-ins before commands, menus, 'pick one of the letters above', 'Done for you' list, locked and skipped labels, action kinds, git's lines under remote errors, the 'See: homebot --help' hint."
  alarm:
    ansi: "bold red (SGR 31 + 1)"
    token: urgent
    used_for: "Only the commit guard headline 'homebot refused this commit:'."
  plain:
    ansi: "none"
    token: none
    used_for: "Everything else."
  rules: "Defined in src/ui.ts:3-15. Color is on only when process.stdout.isTTY and NO_COLOR is unset, decided once at start-up; the same flag colors stderr output. Caches (nudge, count), notifications, commit messages and stored text are never colored on purpose, but stored text can carry ANSI from the run that produced it (renderInbox strips it from details)."
  shell:
    spaceship: "SPACESHIP_HOMEBOT_COLOR, default yellow (shell/homebot.zsh:53)"
    starship: "style = 'bold yellow' in the documented snippet (README.md:208, docs/pages/reference/inbox.md:112)"

glyphs:
  used:
    - glyph: "🚚"
      codepoint: "U+1F69A"
      meaning: "Brand mark: start of the nudge line, the Spaceship default symbol, the Starship snippet. Likely inherited from the old name 'dothaul' (hauling). The only emoji in the product."
      source: "src/inbox.ts:284, shell/homebot.zsh:56, README.md:207, docs/pages/reference/inbox.md:113"
    - glyph: "·"
      codepoint: "U+00B7"
      meaning: "Separator in the inbox header and the inventory title and values."
      source: "src/inbox.ts:249, src/inbox.ts:251, src/cli.ts:247, src/cli.ts:257, src/cli.ts:275, src/cli.ts:283"
    - glyph: "→"
      codepoint: "U+2192"
      meaning: "'Do this' arrow before an inbox fix and next's command; also 'from → to' in pack and 'branch → upstream' in inventory."
      source: "src/inbox.ts:263, src/cli.ts:109, src/cli.ts:126, src/cli.ts:275"
    - glyph: "!"
      codepoint: "U+0021"
      meaning: "Urgent inbox mark (red), and the urgent suffix in the count cache (protocol: '3!')."
      source: "src/inbox.ts:255, src/inbox.ts:292"
    - glyph: "•"
      codepoint: "U+2022"
      meaning: "Non-urgent inbox mark (yellow)."
      source: "src/inbox.ts:255"
    - glyph: "  - "
      codepoint: "ASCII"
      meaning: "Commit guard problem bullet. Protocol: save.ts refusal() parses it."
      source: "src/cli.ts:385"
    - glyph: "[i/N]"
      codepoint: "ASCII"
      meaning: "Step and item counters in unpack, triage and cleanup."
      source: "src/unpack.ts:76, src/triage.ts:160, src/cleanup.ts:273"
    - glyph: "..."
      codepoint: "ASCII"
      meaning: "Truncation: '...and N more', ', ...', '- ...and N more'. Three ASCII dots, never U+2026."
      source: "src/inbox.ts:156, src/inbox.ts:169, src/inbox.ts:265, src/save.ts:55"
    - glyph: ">"
      codepoint: "ASCII"
      meaning: "Input prompt for triage, cleanup and remote; '> ' as the fzf prompt."
      source: "src/triage.ts:168, src/cleanup.ts:279, src/remote.ts:141, src/cleanup.ts:257"
    - glyph: "->"
      codepoint: "ASCII"
      meaning: "Arrow in the profile include-loop error (ASCII, unlike → elsewhere)."
      source: "src/manifest/resolve.ts:56"
    - glyph: "[Y/n]"
      codepoint: "ASCII"
      meaning: "Yes/no default marker."
      source: "src/remote.ts:219"
  not_used: "No spinners, progress bars or box drawing in the CLI. Box drawing appears only in docs/."

messages:

  # ── format: shared helpers in src/ui.ts that other messages embed ──
  - id: format.ago.just_now
    kind: label
    text: "just now"
    placeholders: []
    color: "plain"
    class: voice
    source: "src/ui.ts:32"
    notes: "Returned by ago() and dropped into sentences ('unpacked just now', 'Automatic seal failed just now'). Used under 60 seconds."
  - id: format.ago.minutes
    kind: label
    text: "{m}m ago"
    placeholders:
      - name: m
        type: int
        meaning: "whole minutes, 1-59"
    color: "plain"
    class: voice
    source: "src/ui.ts:34"
    notes: "Already contains 'ago', so sentences that add their own preposition read badly: inbox.unreachable.title gives 'since 4d ago'."
  - id: format.ago.hours
    kind: label
    text: "{h}h ago"
    placeholders:
      - name: h
        type: int
        meaning: "whole hours, 1-47"
    color: "plain"
    class: voice
    source: "src/ui.ts:36"
    notes: null
  - id: format.ago.days
    kind: label
    text: "{d}d ago"
    placeholders:
      - name: d
        type: int
        meaning: "whole days, 2 or more"
    color: "plain"
    class: voice
    source: "src/ui.ts:37"
    notes: null
  - id: format.size
    kind: label
    text: "{value} {unit}"
    placeholders:
      - name: value
        type: string
        meaning: "the size, one decimal under 10 (3.0), whole above"
      - name: unit
        type: string
        meaning: "B, KB, MB or GB (binary multiples, labelled KB/MB/GB)"
    color: "plain"
    class: fact
    source: "src/ui.ts:52"
    notes: "Unit symbols are facts. Decimal point is hard-coded '.'."
  - id: format.command
    kind: hint
    text: "  {command}"
    placeholders:
      - name: command
        type: string
        meaning: "a command line, printed verbatim"
    color: "command"
    class: fact
    source: "src/ui.ts:67"
    notes: "command(): every 'run this' line. Two-space indent, cyan. The rule in ui.ts:61-63 is that commands get their own line; several messages break it (see report)."
  - id: format.failure.tool_line
    kind: error
    text: "  {tool}: {line}"
    placeholders:
      - name: tool
        type: string
        optional: true
        meaning: "the name of an external program"
      - name: line
        type: string
        meaning: "one of the last 3 non-empty lines a tool printed, with git's 'fatal:'/'error:' label removed"
    color: "plain"
    class: fact
    source: "src/ui.ts:105"
    notes: "failure(summary, output, tool?) appends up to 3 of these under a one-line summary. Without a tool name the line is '  {line}'. Text is whatever git/age/gh/glab/systemctl printed: never translatable."

  # ── cli: top-level error printing, dispatch, version, usage errors ──
  - id: cli.error.prefix
    kind: error
    text: "homebot: {message}"
    placeholders:
      - name: message
        type: string
        meaning: "first line of any UserError; the other lines are printed after it, uncolored and verbatim"
    color: "error"
    class: fact
    persona: false
    source: "src/cli.ts:431, src/cli.ts:432"
    speaker_name: true
    notes: "Not voiced: error prefix and runtime wording are protocol text, not a persona line. Every thrown UserError ends up here. The prefix is the program name used as the speaker. Goes to stderr, but is colored when stdout is a TTY."
  - id: cli.error.args
    kind: error
    text: "homebot: {node_message}"
    placeholders:
      - name: node_message
        type: string
        meaning: "Node/Bun parseArgs error text, e.g. \"Unknown option '--x'. To specify a positional argument starting with a '-', place it at the end of the command after '--', as in '-- \\\"--x\\\"\""
    color: "error"
    class: fact
    persona: false
    source: "src/cli.ts:424"
    speaker_name: true
    notes: "Not voiced: error prefix and runtime wording are protocol text, not a persona line. English from the runtime, not from homebot. The Go port should produce its own text."
  - id: cli.error.args_hint
    kind: hint
    text: "See: {homebot}{command_space}{help}"
    placeholders:
      - name: command_space
        type: string
        optional: true
        meaning: "the command being run followed by a space, or empty for the inbox"
      - name: homebot
        type: string
        value: "{self} "
        meaning: "the command word and space (fixed)"
      - name: help
        type: string
        value: "--help"
        meaning: "the help flag (fixed)"
    color: "muted"
    class: voice
    persona: true
    source: "src/cli.ts:425"
    notes: null
  - id: cli.error.unknown_command
    kind: error
    text: "Unknown command \"{name}\". See:"
    append: " {self} --help"
    placeholders:
      - name: name
        type: string
        meaning: "what the user typed as the command"
    color: "plain"
    class: voice
    persona: true
    source: "src/cli.ts:395, src/cli.ts:408"
    notes: null
  - id: cli.version
    kind: status
    text: "{version}"
    placeholders:
      - name: version
        type: string
        meaning: "the version from package.json"
    color: "plain"
    class: fact
    source: "src/cli.ts:411"
    notes: null
  - id: cli.usage.keys
    kind: error
    text: "Usage: homebot keys init"
    placeholders: []
    color: "plain"
    class: fact
    persona: false
    source: "src/cli.ts:197"
    notes: "Not voiced: the usage syntax is a command fact. 'Usage:' is wording; the rest is a fact. Same 'Usage:' word as help.page.usage_label."
  - id: cli.usage.remote
    kind: error
    text: "Usage: homebot remote [url]"
    placeholders: []
    color: "plain"
    class: fact
    persona: false
    source: "src/cli.ts:305"
    notes: "Not voiced: the usage syntax is a command fact"
  - id: cli.usage.action
    kind: error
    text: "Usage: homebot action <name> [args...]. See: homebot actions"
    placeholders: []
    color: "plain"
    class: fact
    persona: false
    source: "src/cli.ts:364"
    notes: "Not voiced: the usage syntax is a command fact"
  - id: cli.usage.actions
    kind: error
    text: "Usage: homebot actions (it takes no arguments). To run one, use: homebot action <name>"
    placeholders: []
    color: "plain"
    class: fact
    persona: false
    source: "internal/cli/order_actions.go"
    notes: "Not voiced: the usage syntax is a command fact. Go only: the TypeScript ignored any argument after 'actions'. 'homebot actions list' is a natural slip for 'homebot action <name>', so the message points there."
  - id: cli.usage.shell
    kind: error
    text: "Usage: homebot shell zsh"
    placeholders: []
    color: "plain"
    class: fact
    persona: false
    source: "src/cli.ts:373"
    notes: "Not voiced: the usage syntax is a command fact"
  - id: cli.usage.hook
    kind: error
    text: "Usage: homebot hook pre-commit"
    placeholders: []
    color: "plain"
    class: fact
    persona: false
    source: "src/cli.ts:378"
    notes: "Not voiced: the usage syntax is a command fact"
  - id: cli.error.unknown_action
    kind: error
    text: "No action named \"{name}\". See:"
    append: " {self} actions"
    placeholders:
      - name: name
        type: string
        meaning: "the action name given to `homebot action`"
    color: "plain"
    class: voice
    persona: true
    source: "src/cli.ts:368"
    notes: null

  # ── identity: asking for git name/email during setup (cli.ts ensureIdentity) and the fixed shell fixes in git.ts ──
  - id: identity.warning.unknown
    kind: warning
    text: "Git doesn't know who you are yet, and {bot} commits as you."
    placeholders:
      - name: bot
        type: string
        optional: true
        meaning: "the persona's display name; homebot in the neutral voice"
    color: "warning"
    class: voice
    persona: true
    source: "src/cli.ts:37"
    notes: null
  - id: identity.hint.set_once
    kind: hint
    text: "Set it once:"
    placeholders: []
    color: "plain"
    class: voice
    persona: true
    source: "src/cli.ts:39"
    notes: "Followed by git.identity_fix on its own line, indented and cyan (not via command(), same look). Printed when stdin is not a TTY."
  - id: identity.prompt.name
    kind: prompt
    text: "Your name:"
    placeholders: []
    color: "plain"
    class: voice
    persona: true
    source: "src/cli.ts:42"
    notes: "ask(); Bun prompt() adds a space. Trailing space in the source is trimmed."
  - id: identity.prompt.email
    kind: prompt
    text: "Your email:"
    placeholders: []
    color: "plain"
    class: voice
    persona: true
    source: "src/cli.ts:43"
    notes: null
  - id: identity.status.skipped
    kind: hint
    text: "Skipped. Set it later:"
    placeholders: []
    color: "plain"
    class: voice
    persona: true
    source: "src/cli.ts:45"
    notes: "Followed by git.identity_fix, indented and cyan."
  - id: identity.error.config_failed
    kind: error
    text: "{git_config} {scope} {setting} {value} failed."
    placeholders:
      - name: scope
        type: string
        meaning: "--global or '--file <path>'"
      - name: setting
        type: string
        meaning: "user.name or user.email"
      - name: value
        type: string
        meaning: "the value typed, shell-quoted"
      - name: git_config
        type: string
        value: "git config"
        meaning: "the git config command (fixed)"
    color: "plain"
    class: voice
    persona: true
    source: "src/cli.ts:54"
    notes: "Plus failure() tool lines."
  - id: identity.success.saved
    kind: success
    text: "saved {name} <{email}> in {config}"
    placeholders:
      - name: name
        type: string
        meaning: "the name typed"
      - name: email
        type: string
        meaning: "the email typed"
      - name: config
        type: string
        meaning: "identity.where.global or the fact '~/.config/git/config'"
    color: "success (first word only)"
    class: voice
    persona: true
    source: "src/cli.ts:56"
    notes: null
  - id: identity.where.global
    kind: label
    text: "your global git config"
    placeholders: []
    color: "plain"
    class: voice
    source: "src/cli.ts:56"
    notes: "Placeholder value for identity.success.saved when GIT_CONFIG_GLOBAL is set."
  - id: identity.hint.track
    kind: hint
    text: "Track it so every machine gets it:"
    placeholders: []
    color: "plain"
    class: voice
    persona: true
    source: "src/cli.ts:58"
    notes: null
  - id: identity.hint.track_cmd
    kind: hint
    text: "{self} pack ~/.config/git/config"
    placeholders:
      - name: self
        type: string
        meaning: "the command word: the name when one works on this machine, else homebot (filled by the renderer)"
    color: "command"
    class: fact
    source: "src/cli.ts:59"
    notes: null
  - id: git.identity_fix
    kind: hint
    text: "mkdir -p ~/.config/git && git config --file ~/.config/git/config user.name \"Your Name\" && git config --file ~/.config/git/config user.email you@example.com"
    placeholders: []
    color: "command"
    class: fact
    source: "src/git.ts:37"
    notes: "A fact that contains English sample values ('Your Name', you@example.com) the user must replace. Shown as the fix of inbox.no_identity and by ensureIdentity. Git reads ~/.config/git/config with or without a ~/.gitconfig."
  - id: git.signing_off
    kind: hint
    text: "git config --file ~/.config/git/config.local commit.gpgsign false && git config --file ~/.config/git/config.local tag.gpgsign false"
    placeholders: []
    color: "command"
    class: fact
    source: "src/git.ts:55"
    notes: "Turns signing off on this machine only: ~/.config/git/config.local is never tracked."
  - id: git.gitconfig_aside
    kind: hint
    text: "mv ~/.gitconfig ~/.gitconfig.homebot-backup-$(date +%Y%m%d-%H%M%S)"
    placeholders: []
    color: "command"
    class: fact
    source: "src/git.ts:80"
    notes: "Moves ~/.gitconfig aside the way homebot link --backup does, so homebot cleanup shows it."
  - id: git.error.failed
    kind: error
    text: "{git} {args} failed."
    placeholders:
      - name: args
        type: string
        meaning: "the git arguments, space-joined"
      - name: git
        type: string
        value: "git"
        meaning: "the tool that failed (fixed)"
    color: "plain"
    class: voice
    persona: true
    source: "src/git.ts:14"
    notes: "In gitOk(), which nothing calls today (dead code). Plus failure() tool lines."

  # ── next: run the first inbox item's fix (cli.ts) ──
  - id: next.success.nothing
    kind: success
    text: "Nothing needs you."
    placeholders: []
    color: "success"
    class: voice
    persona: true
    source: "src/cli.ts:96"
    notes: null
  - id: next.item.title
    kind: inbox
    text: "{title}"
    placeholders:
      - name: title
        type: string
        meaning: "an inbox item title (one of inbox.*.title)"
    color: "heading"
    class: fact
    source: "src/cli.ts:99"
    notes: "Re-prints the first inbox item's title (an inbox.*.title); no new wording."
  - id: next.item.detail
