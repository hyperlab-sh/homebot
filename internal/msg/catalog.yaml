      - name: os
        type: string
        meaning: "this machine's system (linux or macos)"
      - name: layers
        type: string
        meaning: "the layers linked on this machine, comma-joined"
    color: "plain"
    class: voice
    persona: true
    source: "internal/pack/pack.go"
    notes: "Go-only. The TypeScript moved the file and then failed to link it back (homebot link never reads the other system's layer). Nothing is moved."
  - id: pack.error.source_not_removed
