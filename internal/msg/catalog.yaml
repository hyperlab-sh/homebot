        meaning: "what the system said"
    color: "plain"
    class: voice
    persona: true
    source: "internal/pack/move.go"
    notes: "Go-only. The move crossed devices, so it copied; removing the original failed. The copy is whole and in the repo."
  - id: pack.status.moved
    kind: status
