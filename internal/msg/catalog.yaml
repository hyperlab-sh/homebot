  # ── guard: the pre-commit hook (cli.ts hook, hook.ts, hooks/pre-commit) ──
  - id: guard.headline
    kind: error
    text: "homebot refused this commit:"
    placeholders: []
    color: "alarm"
    class: voice
    source: "src/cli.ts:381"
    speaker_name: true
    notes: "stderr. Protocol: save.refusal() drops this exact line with /^homebot refused this commit:?$/. Changing it per persona breaks `homebot save`'s error unless the parser changes too. Runs in a separate process started by git."
  - id: guard.bullet
    kind: error
    text: "  - {problem}"
    placeholders:
      - name: problem
        type: string
        meaning: "first line of a guard.* problem; its other lines follow indented two spaces"
    color: "plain"
    class: fact
    source: "src/cli.ts:385-386"
    notes: "Protocol: save.refusal() finds problems by the '  - ' prefix."
  - id: guard.seal_failed
    kind: error
    text: "Could not seal secrets: {message}"
    placeholders:
      - name: message
        type: string
        meaning: "a message from a lower layer: English, possibly several lines, possibly from a tool"
    color: "plain"
    class: voice
    source: "src/hook.ts:66"
    notes: "Nests a secrets.error.* message."
  - id: guard.plaintext
    kind: error
    text: "{file_path} is plaintext. Only *.age files may be committed from private/. Unstage it:\n  git rm --cached {file_path}"
    placeholders:
      - name: file_path
        type: path
        meaning: "the staged path, repo-relative"
    color: "plain"
    class: mixed
    source: "src/hook.ts:73"
    notes: null
  - id: guard.plaintext_not_ignored
    kind: error
    text: "{file_path} is plaintext, and {gitignore} does not ignore it, so every save stages it again. Only *.age files may be committed from private/: edit {gitignore} so it ignores the file, then unstage it:\n  git rm --cached {file_path}"
    placeholders:
      - name: file_path
        type: path
        meaning: "the staged path, repo-relative"
      - name: gitignore
        type: path
        meaning: "the ignore file whose negated pattern lets it through, as git check-ignore names it (repo-relative for a .gitignore in the repo), or private/.gitignore when no pattern matches"
    color: "plain"
    class: mixed
    source: "internal/guard/guard.go"
    notes: "Go-only. guard.plaintext for a file git does not ignore (git check-ignore --no-index): save's git add -- private takes it on every save, so git rm --cached alone does not help. A file git ignores was force-added and gets guard.plaintext."
  - id: guard.too_big
    kind: error
    text: "{file_path} is {size} (limit {limit} MB). Unstage it and add it to .gitignore."
    placeholders:
      - name: file_path
        type: path
        meaning: "the staged path, repo-relative"
      - name: size
        type: string
        meaning: "format.size; when that would round to the limit or below it, the size in MB with two decimals, so it never reads as the limit itself (e.g. '1.05 MB')"
      - name: limit
        type: string
        meaning: "limits.maxFileMB from homebot.yml, written as JavaScript writes a number (1, 50, 0.5)"
    color: "plain"
    class: mixed
    source: "src/hook.ts:82"
    notes: "Deliberate difference (decision D2): the TypeScript said 'just over N MB (limit N MB)' where the rounded size equalled the limit; Go shows two decimals there ('big.bin is 1.05 MB (limit 1 MB)'). Tests assert 'furniture/big.bin is 10.29 MB (limit 10 MB)' and 'is 3.0 MB (limit 1 MB)'. limit is a string because maxFileMB may be fractional."
  - id: guard.no_gitleaks
    kind: error
    text: "gitleaks is not installed, so this commit can't be checked for leaked secrets. Install it:\n  brew install gitleaks"
    placeholders: []
    color: "plain"
    class: mixed
    source: "src/hook.ts:87"
    notes: null
  - id: guard.gitleaks_failed
    kind: error
    text: "gitleaks failed to run: {why}"
    placeholders:
      - name: why
        type: string
        meaning: "gitleaks' first stderr line, or guard.gitleaks_failed.exit_code"
    color: "plain"
    class: mixed
    source: "src/hook.ts:90"
    notes: null
  - id: guard.gitleaks_failed.exit_code
    kind: error
    text: "exit code {code}"
    placeholders:
      - name: code
        type: int
        meaning: "a process exit code"
    color: "plain"
    class: voice
    source: "src/hook.ts:54"
    notes: null
  - id: guard.leak
    kind: error
    text: "gitleaks found something that looks like a secret. Move it to private/ (homebot pack --private <path>) or unstage it.\n{gitleaks_output}"
    placeholders:
      - name: gitleaks_output
        type: string
        meaning: "gitleaks' redacted report, every line indented two spaces"
    color: "plain"
    class: mixed
    source: "src/hook.ts:92"
    notes: "Command in parentheses mid-sentence."
  - id: guard.script.no_runtime
    kind: error
    text: "homebot: homebot isn't installed, so this commit can't be checked. Refusing."
    placeholders: []
    color: "plain"
    class: mixed
    source: "internal/guard/pre-commit.sh"
    speaker_name: true
    notes: "The shim's one line when it finds no homebot to run (git runs the shim before every commit). homebot writes it into the shim when it installs it, so the shim prints it without the binary. The TypeScript's hooks/pre-commit said 'neither bun nor homebot is installed'; the Go shim never looks for bun."

