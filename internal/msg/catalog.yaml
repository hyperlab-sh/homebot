        meaning: "the file relative to the repo, such as private/identity.age"
    color: "plain"
    class: voice
    persona: true
    source: "internal/secrets/secrets.go"
    notes: "Sealing or unlocking a secret whose plaintext or .age file would be one of private/'s own files (identity.age, recipients.txt, README.md, .gitignore, .gitkeep). List skips such secrets, so this is a last check before writing. The TypeScript wrote over them."
  - id: secrets.error.unsupported_ssh_key
    kind: error
    text: "Line {line} of {recipients} holds a key age cannot encrypt to ({key_type}). Use an {ed25519} key, or an {rsa} key of at least {bits}; homebot never seals to fewer keys than the file lists."
    placeholders:
      - name: line
        type: int
        meaning: "the line's number in private/recipients.txt, counting from 1"
      - name: key_type
        type: string
        meaning: "the key's type as the line names it, such as ecdsa-sha2-nistp256, sk-ssh-ed25519@openssh.com, ssh-dss, or ssh-rsa for a key under 2048 bits"
      - name: recipients
        type: string
        value: "private/recipients.txt"
        meaning: "the recipients path (fixed)"
      - name: ed25519
        type: string
        value: "ssh-ed25519"
        meaning: "the supported SSH key type (fixed)"
      - name: rsa
        type: string
        value: "ssh-rsa"
        meaning: "the supported SSH key type (fixed)"
      - name: bits
        type: string
        value: "2048 bits"
        meaning: "the minimum RSA size (fixed)"
    color: "plain"
    class: voice
    persona: true
    source: "internal/secrets/seal.go"
    notes: "A well-formed ssh public key other than ssh-ed25519 or ssh-rsa, or an ssh-rsa key under 2048 bits, told apart as the age CLI did. The age CLI warned 'recipients file ...: ignoring unsupported SSH key of type ... at line N' and sealed to the other keys; homebot seals nothing."
  - id: secrets.error.save_key
    kind: error
    text: "Saving the new key to {path} failed; nothing was saved."
    placeholders:
      - name: path
        type: path
        meaning: "private/identity.age or private/recipients.txt, relative to the repo"
    color: "plain"
    class: voice
    persona: true
    source: "internal/secrets/keys.go"
    notes: "Writing a key file failed for a reason other than the file appearing while keys init asked for the passphrase (secrets.error.keys_exist); the reason follows. The TypeScript showed secrets.error.encrypt_key when age could not write identity.age, and threw the raw error when recipients.txt could not be written."
  - id: secrets.error.save_gitignore
    kind: error
    text: "Writing {path} failed, so nothing was set up: without it, git would take the plaintext secrets in {private}."
    placeholders:
      - name: path
        type: path
        meaning: "private/.gitignore, relative to the repo"
      - name: private
        type: string
        value: "private/"
        meaning: "the private directory (fixed)"
    color: "plain"
    class: voice
    persona: true
    source: "internal/secrets/gitignore.go"
    notes: "Go-only (D14). keys init and pack --private write private/.gitignore when it is missing, before anything else; the reason follows. Neither the TypeScript nor the Go port wrote it before."

  - id: guard.check_failed
    kind: error
    text: "Could not check the staged files: {message}"
    placeholders:
      - name: message
        type: string
        meaning: "why git could not list the staged files or their sizes: English, possibly several lines, possibly from git"
    color: "plain"
    class: voice
    source: "internal/guard/guard.go"
    notes: "Go-only. The TypeScript read empty output when git diff --cached or git cat-file failed, and let the commit through unchecked; the Go guard refuses it."
  - id: guard.not_home
    kind: error
    text: "{repo} has no homebot.yml, so this commit can't be checked. Refusing."
    placeholders:
      - name: repo
        type: path
        meaning: "the top of the work tree git is committing in"
    color: "plain"
    class: voice
    source: "internal/guard/guard.go"
    notes: "Go-only. hook pre-commit checks the repo git is committing in (git rev-parse --show-toplevel), never the home HOMEBOT_ROOT or the cwd lookup would pick; the TypeScript checked that other home and let the commit through. Printed after 'homebot: '."
  - id: guard.not_sealed
    kind: error
    text: "{file_path} is named like a sealed file but is not age-encrypted. Unstage it:\n  git rm --cached {file_path}"
    placeholders:
      - name: file_path
        type: path
        meaning: "the staged path, repo-relative"
    color: "plain"
    class: mixed
    source: "internal/guard/guard.go"
    notes: "Go-only. The TypeScript trusted any private/**.age by its name; Go reads the staged blob and requires the age header (binary or armored)."
  - id: guard.hooks_path_overridden
    kind: error
    text: "core.hooksPath is {path} after homebot set it to {want}: a worktree config or an include overrides it, so the commit guard would not run. Remove that setting."
    placeholders:
      - name: path
        type: string
        meaning: "core.hooksPath as git reads it after homebot set it, empty when unset"
      - name: want
        type: path
        meaning: "the hooks directory homebot set, $XDG_DATA_HOME/homebot/hooks"
    color: "plain"
    class: voice
    source: "internal/guard/install.go"
    notes: "Go-only. InstallHooks re-reads the effective core.hooksPath after writing it."
  - id: guard.private_gitlink
    kind: error
    text: "{file_path} is a repository (a submodule or an embedded repo). Only *.age files may be committed from private/. Unstage it:\n  git rm --cached {file_path}"
    placeholders:
      - name: file_path
        type: path
        meaning: "the staged gitlink's path, repo-relative"
    color: "plain"
    class: mixed
    source: "internal/guard/guard.go"
    notes: "Go-only. The TypeScript let a gitlink (mode 160000) under private/ through; Go refuses it."
  - id: guard.private_not_folder
    kind: error
    text: "{file_path} is staged as a symlink or a file, not a folder: committing it would drop every sealed secret from the repo. Make private a real folder again, then unstage it:\n  git rm --cached {file_path}"
    placeholders:
      - name: file_path
        type: path
        meaning: "the staged path, private in any case, repo-relative"
    color: "plain"
    class: mixed
    source: "internal/guard/guard.go"
    notes: "Go-only. A symlink (mode 120000) or a file at the path private itself; git treats everything beyond a symlink as gone, so the same commit deletes every private/**.age. The TypeScript let it through."
  - id: guard.all_sealed_deleted
    kind: error
    text: "This commit deletes {n:# sealed file|all # sealed files} in private/ and leaves none: private/ is missing, moved or emptied. If that is a mistake, put it back and unstage the deletions with the first command. If you mean to remove your secrets from the repo, commit with git yourself, in the home repo, with the second:\n  git restore --staged private\n  git commit --no-verify -- private"
    placeholders:
      - name: n
        type: int
        meaning: "how many private/**.age files the commit deletes"
        forms: "# sealed file|all # sealed files"
    color: "plain"
    class: mixed
    source: "internal/guard/guard.go"
    notes: "Go-only. The staged commit deletes every .age file under private/ and the index keeps none. Another machine pulling it would lose every secret. A deliberate removal is committed with git directly: --no-verify skips the guard; there is no homebot flag for it. The command ends in -- private so that only the private/ deletions skip the guard: save has already staged everything, and a plain --no-verify would also commit, unchecked, anything gitleaks flags in the same save."
  - id: pack.error.private_reserved
    kind: error
    text: "{path} can't go into {private}: git would stage it as plaintext there. {readme}, {gitignore}, {gitkeep} and {recipients} files, {age_glob} files and {git_dir} folders are the repo's own; rename or remove it first."
    placeholders:
      - name: path
        type: path
        meaning: "the first thing inside the packed path (or the path itself) with such a name, ~-shortened"
      - name: private
        type: string
        value: "private/"
        meaning: "the private secrets directory (fixed)"
      - name: readme
        type: string
        value: "README.md"
        meaning: "the reserved readme file (fixed)"
      - name: gitignore
        type: string
        value: ".gitignore"
        meaning: "the reserved ignore file (fixed)"
      - name: gitkeep
        type: string
        value: ".gitkeep"
        meaning: "the reserved placeholder file (fixed)"
      - name: recipients
        type: string
        value: "recipients.txt"
        meaning: "the recipients file (fixed)"
      - name: age_glob
        type: string
        value: "*.age"
        meaning: "the encrypted file pattern (fixed)"
      - name: git_dir
        type: string
        value: ".git"
        meaning: "the git metadata directory (fixed)"
    color: "plain"
    class: voice
    persona: true
    source: "internal/pack/pack.go"
    notes: "Go-only. pack --private refuses before moving anything. private/.gitignore lets those names through at every depth, and a .gitignore inside the packed folder can re-include anything, so the plaintext could be staged and committed. The TypeScript moved it anyway."
  - id: pack.error.nested_repo
    kind: error
    text: "{path} is a git repository of its own: the home repo would hold only a pointer to it, and its files would never reach the remote. Remove its {git_dir}, or leave it out of the home."
    placeholders:
      - name: path
        type: path
        meaning: "the folder holding the nested .git, ~-shortened: the packed path or one inside it, or the repo path triage tried to stage"
      - name: git_dir
        type: string
        value: ".git"
        meaning: "the git metadata directory (fixed)"
    color: "plain"
    class: voice
    persona: true
    source: "internal/pack/pack.go, internal/pack/stage.go"
    notes: "Go-only (D12). pack refuses a path holding a .git at any depth before moving anything, and staging never leaves a gitlink (mode 160000) in the index: it is unstaged and this error returned. The TypeScript moved it, and git add staged a gitlink whose files never reached the remote."
  - id: pack.error.unreadable
    kind: error
    text: "Can't read {path}, so homebot can't check it for a git repository of its own. Nothing was moved; make it readable, or leave it out of the home."
    placeholders:
      - name: path
        type: path
        meaning: "the folder inside the packed path that could not be read, ~-shortened"
    color: "plain"
    class: voice
    persona: true
    source: "internal/pack/pack.go"
    notes: "Go-only (D12). Plain pack looks through the whole tree for a nested .git before moving; a folder it cannot read could hold one, so it refuses instead of risking a gitlink. pack --private says the same when its walk for names private/ lets through cannot read a folder. The TypeScript moved such a tree."
  - id: pack.error.layer_not_linked
