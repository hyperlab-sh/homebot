        meaning: "the recipients path (fixed)"
    color: "plain"
    class: voice
    persona: true
    source: "internal/secrets/seal.go"
    notes: "Blank lines and # comments only. The age CLI said 'no recipients found'."
  - id: secrets.error.reserved
