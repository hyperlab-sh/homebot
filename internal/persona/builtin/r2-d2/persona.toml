schema = 1
id = "r2-d2"
name = "R2-D2"
emoji = "📡"
tagline = "Dweet-bwoo-wee! [the plans are safe, and so is your home]"
extends = "neatpik"
lang = "en"

[colors]
accent = { light = "#305B72", dark = "#A1D7F0" }
ok = { light = "#245D38", dark = "#9DE0AF" }
muted = { light = "#5E6470", dark = "#B0B6C0" }

