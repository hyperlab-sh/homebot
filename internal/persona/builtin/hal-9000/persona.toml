schema = 1
id = "hal-9000"
name = "HAL 9000"
emoji = "🔴"
tagline = "Completely operational, Dave. There is no need to worry."
extends = "neatpik"
lang = "en"

[colors]
accent = { light = "#743C46", dark = "#E8AAB5" }
ok = { light = "#245D38", dark = "#9DE0AF" }
muted = { light = "#5E6470", dark = "#B0B6C0" }

