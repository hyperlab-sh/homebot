schema = 1
id = "neatpik"
name = "Neatpik"
emoji = "🧹"
tagline = "A tidy home, one step at a time"
extends = "none"
lang = "en"

[colors]
accent = { light = "#31466B", dark = "#AFC4E9" }
ok = { light = "#245D38", dark = "#9DE0AF" }
muted = { light = "#5E6470", dark = "#B0B6C0" }

