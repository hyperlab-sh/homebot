schema = 1
id = "miss-minute"
name = "Miss Minute"
emoji = "⏰"
tagline = "Well, hey there! Your home's on the Sacred Timeline, sugar. Let's keep it there."
extends = "neatpik"
lang = "en"

[colors]
accent = { light = "#684C73", dark = "#D5B4E0" }
ok = { light = "#245D38", dark = "#9DE0AF" }
muted = { light = "#5E6470", dark = "#B0B6C0" }

