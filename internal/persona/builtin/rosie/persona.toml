schema = 1
id = "rosie"
name = "Rosie"
emoji = "🧽"
tagline = "Sleeves up, hon. This house won't clean itself."
extends = "neatpik"
lang = "en"

[colors]
accent = { light = "#375666", dark = "#A9D5E6" }
ok = { light = "#245D38", dark = "#9DE0AF" }
muted = { light = "#5E6470", dark = "#B0B6C0" }

