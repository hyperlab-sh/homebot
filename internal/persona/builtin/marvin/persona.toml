schema = 1
id = "marvin"
name = "Marvin"
emoji = "☔"
tagline = "Brain the size of a planet, and they ask me to tidy a home."
extends = "neatpik"
lang = "en"

[colors]
accent = { light = "#4A5A78", dark = "#A3B3CF" }
ok = { light = "#245D38", dark = "#9DE0AF" }
muted = { light = "#5E6470", dark = "#B0B6C0" }

